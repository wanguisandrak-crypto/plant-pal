<main>
<section id="dashboard">
  <h2>My plant collection</h2>
  <button id="addplant-btn" type="button">Add new plant</button>
  <div id="plant-container" class="plant-grid"></div>
  <section id="plantform-modal" class="modal hidden" aria-label="Add a plant">
    <div class="modal-content">
      <button type="button" id="close-btn" class="close-btn" aria-label="Close">&times;</button>
      <form id="plantform">
        <input type="text" id="plant-name" placeholder="Plant name" aria-label="Plant name" required>
        <input type="text" id="plant-species" placeholder="Plant species" aria-label="Plant species" required>
        <input type="text" id="plant-location" placeholder="Location" aria-label="Location" required>
        <input type="number" id="water-frequency" placeholder="Watering frequency (days)" aria-label="Watering frequency in days" required>
        <button type="submit" id="addplant">Add plant</button>
      </form>
    </div>
  </section>
</section>
</main>

<script src="script.js"></script>

</body>
</html>
